<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The Folds: seven cut-paper companions, each showing its reviewing gesture</title>
  <desc id="d">A row of seven flat cut-paper figures on a cream ground. From left to right: a tall teal folded letter with no arms, which touches nothing: a pale sight cone runs from its eyes onto one line of a card and leaves no mark, and a small bubble holding a single dot shows it answering; a wide amber folder with a small mustard flag tucking a slip beside a card, never on it; a small light violet droplet pointing at a line with the dry end of a paintbrush; a violet square with a dog-eared corner laying a thread under a line; a deep violet box-lid shape with the same mustard flag holding a set square as a frame around a spot; a short grey paper roll holding a tape of tick marks flat; and a human in a dark ink coat tapping a page with the capped end of a dark pen.</desc>
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceAlpha" dx="4" dy="5" result="o"/>
      <feFlood flood-color="#1F2430" flood-opacity="0.16"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rollclip"><rect x="-48" y="-152" width="96" height="114" rx="40"/></clipPath>

    <g id="card">
      <rect width="64" height="100" fill="#FFFDF8" filter="url(#sh)"/>
      <rect width="64" height="8" fill="#E4DED2"/>
      <path d="M8,24 H56 M8,38 H48 M8,66 H52 M8,80 H40" fill="none" stroke="#CFC8BA" stroke-width="4" stroke-linecap="round"/>
      <path d="M8,52 H56" fill="none" stroke="#7A7468" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g id="flag">
      <path d="M0,0 V-50" fill="none" stroke="#5B5548" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,-50 L28,-41 L0,-32 Z" fill="#E0A82E"/>
    </g>

    <!-- Sill: a letter folded in three, flap open -->
    <g id="sill">
      <path d="M-16,-42 V0 h-14 M16,-42 V0 h14" fill="none" stroke="#0A4A45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g filter="url(#sh)">
        <path d="M-44,-300 L38,-304 L12,-352 Z" fill="#5FB3AA"/>
        <path d="M46,-212 L54,-205 L47,-126 L40,-128 Z" fill="#0A4A45"/>
        <path d="M-42,-125 L-50,-119 L-46,-40 L-40,-40 Z" fill="#0A4A45"/>
        <path d="M-42,-125 L40,-128 L44,-40 L-40,-40 Z" fill="#0B5F59"/>
        <path d="M-38,-215 L46,-212 L40,-128 L-42,-125 Z" fill="#0F766E"/>
        <path d="M-44,-300 L38,-304 L46,-212 L-38,-215 Z" fill="#14857C"/>
        <path d="M-44,-300 L38,-304 L0,-284 Z" fill="#0F766E"/>
      </g>
      <circle cx="-13" cy="-258" r="7" fill="#F7F5F0"/><circle cx="17" cy="-259" r="7" fill="#F7F5F0"/>
      <circle cx="-10.500" cy="-257" r="3" fill="#1F2430"/><circle cx="19.500" cy="-258" r="3" fill="#1F2430"/>
      <path d="M-3,-238 h11" fill="none" stroke="#F7F5F0" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Brae: an expanding folder, top edge folded over -->
    <g id="brae">
      <path d="M-28,-44 V0 h-14 M28,-44 V0 h14" fill="none" stroke="#8A3F06" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#flag" x="-34" y="-226"/>
      <g filter="url(#sh)">
        <path d="M-50,-232 L46,-238 L80,-42 L-76,-42 Z" fill="#B45309"/>
        <path d="M51,-207 L80,-42 L56,-42 Z" fill="#9A4507"/>
        <path d="M-2,-197 L8,-198 L12,-42 L-6,-42 Z" fill="#9A4507"/>
        <g>
          <rect x="-11" y="-22" width="22" height="40" fill="#8B5CF6" transform="translate(-56,-98) rotate(-22)"/>
          <rect x="-11" y="-22" width="22" height="40" fill="#6D28D9" transform="translate(-45,-102) rotate(-8)"/>
          <rect x="-11" y="-22" width="22" height="40" fill="#4C1D95" transform="translate(-34,-102) rotate(6)"/>
          <rect x="-11" y="-22" width="22" height="40" fill="#FFFDF8" transform="translate(-23,-99) rotate(20)"/>
        </g>
        <path d="M-69,-95 L-8,-98 L-14,-42 L-76,-42 Z" fill="#C8691F"/>
        <path d="M-50,-232 L46,-238 L51,-207 L-55,-190 Z" fill="#DE9448"/>
      </g>
      <circle cx="-22" cy="-160" r="7" fill="#F7F5F0"/><circle cx="26" cy="-163" r="7" fill="#F7F5F0"/>
      <circle cx="-19.500" cy="-159" r="3" fill="#1F2430"/><circle cx="28.500" cy="-162" r="3" fill="#1F2430"/>
      <path d="M-6,-141 q8,6 16,-1" fill="none" stroke="#F7F5F0" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Pim: a hand-cut droplet with a bent tip -->
    <g id="pim">
      <path d="M-16,-40 V0 h-12 M16,-40 V0 h12" fill="none" stroke="#5B33C9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g filter="url(#sh)">
        <path d="M-14,-146 L22,-150 L36,-124 L50,-88 L40,-52 L8,-34 L-30,-42 L-50,-78 L-40,-122 Z" fill="#8B5CF6"/>
        <path d="M-14,-146 L22,-150 L20,-188 Z" fill="#B79CFB"/>
        <path d="M-50,-78 L-30,-42 L8,-34 L-16,-66 Z" fill="#7446E0"/>
        <path d="M-40,-122 L-14,-146 L-24,-116 Z" fill="#9D78F9"/>
      </g>
      <circle cx="-12" cy="-110" r="7" fill="#F7F5F0"/><circle cx="14" cy="-111" r="7" fill="#F7F5F0"/>
      <circle cx="-9.500" cy="-110" r="3" fill="#1F2430"/><circle cx="16.500" cy="-111" r="3" fill="#1F2430"/>
      <path d="M-46,-94 Q2,-64 48,-92" fill="none" stroke="#4A3A7A" stroke-width="2"/>
      <circle cx="-12" cy="-80.500" r="5" fill="#EDE9FE"/><circle cx="3" cy="-78" r="5" fill="#E0A82E"/><circle cx="18" cy="-81" r="5" fill="#EDE9FE"/>
    </g>

    <!-- Odet: a square with a dog-eared corner and a knotted ribbon -->
    <g id="odet">
      <path d="M-20,-44 V0 h-13 M20,-44 V0 h13" fill="none" stroke="#4A1AA0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g filter="url(#sh)">
        <path d="M-60,-156 L22,-160 L58,-126 L60,-44 L-56,-40 Z" fill="#6D28D9"/>
        <path d="M-60,-156 L-56,-40 L-22,-41 Z" fill="#5A1FBF"/>
        <path d="M22,-160 L58,-126 L24,-123 Z" fill="#A98BF5"/>
      </g>
      <path d="M-44,-157 l-13,15 M-44,-157 l5,20" fill="none" stroke="#E4674F" stroke-width="5" stroke-linecap="butt"/>
      <rect x="-49" y="-162" width="10" height="10" fill="#C9523C" transform="rotate(-12 -44 -157)"/>
      <circle cx="-14" cy="-108" r="7" fill="#F7F5F0"/><circle cx="14" cy="-109" r="7" fill="#F7F5F0"/>
      <circle cx="-11.500" cy="-108" r="3" fill="#1F2430"/><circle cx="16.500" cy="-109" r="3" fill="#1F2430"/>
      <path d="M-5,-88 h12" fill="none" stroke="#F7F5F0" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Fenn: an unfolded box lid, four flaps round a panel -->
    <g id="fenn">
      <path d="M-18,-42 V0 h-13 M18,-42 V0 h13" fill="none" stroke="#2F1063" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#flag" x="-16" y="-160"/>
      <g filter="url(#sh)">
        <path d="M-34,-145 L34,-148 L36,-58 L-34,-56 Z" fill="#4C1D95"/>
        <path d="M-34,-145 L34,-148 L26,-170 L-26,-168 Z" fill="#6A3BBE"/>
        <path d="M-34,-145 L-34,-56 L-64,-100 Z" fill="#3B1578"/>
        <path d="M34,-148 L36,-58 L66,-104 Z" fill="#5727A6"/>
        <path d="M-34,-56 L36,-58 L26,-40 L-24,-38 Z" fill="#2F1063"/>
      </g>
      <circle cx="-13" cy="-112" r="7" fill="#F7F5F0"/><circle cx="13" cy="-113" r="7" fill="#F7F5F0"/>
      <circle cx="-10.500" cy="-112" r="3" fill="#1F2430"/><circle cx="15.500" cy="-113" r="3" fill="#1F2430"/>
      <path d="M-5,-92 q6,5 12,0" fill="none" stroke="#F7F5F0" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Tally: a short roll of paper with a pencil stub tucked behind -->
    <g id="tally">
      <path d="M-16,-42 V0 h-12 M16,-42 V0 h12" fill="none" stroke="#5E574F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="rotate(-24 -24 -150)">
        <rect x="-29" y="-180" width="10" height="34" fill="#D6CFC2"/>
        <path d="M-29,-180 L-24,-192 L-19,-180 Z" fill="#C9A56A"/>
        <path d="M-26,-187 L-24,-192 L-22,-187 Z" fill="#1F2430"/>
      </g>
      <g filter="url(#sh)">
        <rect x="-48" y="-152" width="96" height="114" rx="40" fill="#8A8178"/>
        <path d="M16,-160 L60,-160 L60,-30 L6,-30 Z" fill="#9D948A" clip-path="url(#rollclip)"/>
        <path d="M15,-152 L32,-150 L14,-130 Z" fill="#BDB5AA"/>
      </g>
      <circle cx="-14" cy="-122" r="7" fill="#F7F5F0"/><circle cx="16" cy="-122" r="7" fill="#F7F5F0"/>
      <circle cx="-13" cy="-120" r="3" fill="#1F2430"/><circle cx="17" cy="-120" r="3" fill="#1F2430"/>
    </g>

    <!-- Maren: the one human, in an ink coat with one lapel folded to its gold lining -->
    <g id="maren">
      <path d="M-40,0 a20,9 0 0 1 40,0 Z M4,0 a20,9 0 0 1 40,0 Z" fill="#1F2430"/>
      <path d="M-30,-130 H-8 V-8 H-28 Z M8,-130 H30 V-8 H10 Z" fill="#3B4252"/>
      <rect x="-9" y="-346" width="18" height="20" fill="#B87B54"/>
      <g filter="url(#sh)">
        <path d="M-48,-330 L48,-330 L64,-124 L-70,-112 Z" fill="#1F2430"/>
        <path d="M48,-330 L64,-124 L40,-122 L34,-300 Z" fill="#2B3142"/>
        <path d="M-14,-332 L14,-332 L0,-290 Z" fill="#F7F5F0"/>
        <path d="M14,-332 L32,-330 L5,-258 L0,-290 Z" fill="#B8860B"/>
      </g>
      <path d="M4,-258 L2,-120" fill="none" stroke="#343B4D" stroke-width="2"/>
      <circle cx="0" cy="-372" r="34" fill="#C68B62"/>
      <path d="M36,-413 L52,-408 L58,-392 L48,-380 L34,-384 L28,-400 Z" fill="#2B2126"/>
      <path d="M-33,-384 C-26,-420 30,-422 36,-384 L38,-356 L27,-360 C26,-382 6,-394 -33,-384 Z" fill="#2B2126"/>
      <path d="M30,-416 L56,-378" fill="none" stroke="#B8860B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-17" cy="-370" r="3.500" fill="#1F2430"/><circle cx="5" cy="-370" r="3.500" fill="#1F2430"/>
      <path d="M-13,-354 q6,4 11,0" fill="none" stroke="#1F2430" stroke-width="2.500" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- backdrop: one big sheet with a turned corner, and the floor -->
  <rect width="1600" height="900" fill="#F7F5F0"/>
  <path d="M70,150 L1420,128 L1534,228 L1544,590 L58,598 Z" fill="#F1EDE4"/>
  <path d="M1420,128 L1534,228 L1428,236 Z" fill="#E6E0D3"/>
  <path d="M0,662 L1600,654 L1600,900 L0,900 Z" fill="#EAE5DA"/>

  <!-- 1. Sill, the advisor: armless; a sight cone on one line, a bubble with one dot -->
  <g transform="translate(75,674)">
    <ellipse cx="2" cy="4" rx="50" ry="7" fill="#DDD6C8"/>
    <path d="M107,-150 V0 m-12,0 h24" fill="none" stroke="#BDB5A6" stroke-width="4" stroke-linecap="round"/>
    <use href="#card" x="75" y="-250"/>
    <use href="#sill"/>
    <path d="M20,-258 L75,-208 L139,-208 L139,-188 L75,-188 Z" fill="#7CCBC2" fill-opacity="0.5"/>
    <circle cx="-13" cy="-258" r="7" fill="#F7F5F0"/><circle cx="-10.5" cy="-256.5" r="3" fill="#1F2430"/><circle cx="17" cy="-259" r="7" fill="#F7F5F0"/><circle cx="19.5" cy="-257.5" r="3" fill="#1F2430"/>
    <g filter="url(#sh)"><path d="M80,-290 L56,-268 L94,-281 Z" fill="#FFFDF8"/><ellipse cx="98" cy="-298" rx="24" ry="17" fill="#FFFDF8"/></g><circle cx="98" cy="-298" r="5" fill="#0F766E"/>
  </g>

  <!-- 2. Brae, the coordinator: a slip tucked beside the card -->
  <g transform="translate(300,672)">
    <ellipse cx="2" cy="4" rx="84" ry="8" fill="#DDD6C8"/>
    <path d="M128,-115 V0 m-12,0 h24" fill="none" stroke="#BDB5A6" stroke-width="4" stroke-linecap="round"/>
    <use href="#card" x="96" y="-215"/>
    <use href="#brae"/>
    <rect x="80" y="-184" width="12" height="42" fill="#F3D2A6" filter="url(#sh)" transform="rotate(-3 86 -163)"/>
    <path d="M60,-150 Q72,-138 83,-150" fill="none" stroke="#8A3F06" stroke-width="6" stroke-linecap="round"/>
    <path d="M-66,-140 Q-88,-116 -66,-100" fill="none" stroke="#8A3F06" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 3. Pim, delegate: the dry end of the brush points -->
  <g transform="translate(520,670)">
    <ellipse cx="2" cy="4" rx="48" ry="7" fill="#DDD6C8"/>
    <path d="M118,-70 V0 m-12,0 h24" fill="none" stroke="#BDB5A6" stroke-width="4" stroke-linecap="round"/>
    <use href="#card" x="86" y="-170"/>
    <use href="#pim"/>
    <path d="M28.500,-62.800 L23.500,-69.200 L15,-63 L10,-53 L21,-57 Z" fill="#2E2152"/>
    <path d="M34,-72 L88,-114.500" fill="none" stroke="#C9A56A" stroke-width="5" stroke-linecap="round"/>
    <path d="M26,-66 L35,-73" fill="none" stroke="#9CA3AF" stroke-width="8"/>
    <path d="M42,-102 Q58,-100 50,-85" fill="none" stroke="#5B33C9" stroke-width="6" stroke-linecap="round"/>
    <path d="M-45,-92 Q-62,-76 -52,-62" fill="none" stroke="#5B33C9" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 4. Odet, delegate: a thread laid under the line -->
  <g transform="translate(740,670)">
    <ellipse cx="2" cy="4" rx="60" ry="7" fill="#DDD6C8"/>
    <path d="M124,-70 V0 m-12,0 h24" fill="none" stroke="#BDB5A6" stroke-width="4" stroke-linecap="round"/>
    <use href="#card" x="92" y="-170"/>
    <use href="#odet"/>
    <path d="M76,-111.500 H152 q7,0 7,7 q0,6 -5,4" fill="none" stroke="#3B2A6B" stroke-width="2.500" stroke-linecap="round"/>
    <rect x="63" y="-121" width="14" height="22" fill="#3B2A6B"/>
    <rect x="60" y="-125" width="20" height="5" fill="#C9A56A"/><rect x="60" y="-100" width="20" height="5" fill="#C9A56A"/>
    <path d="M57,-96 Q64,-86 70,-96" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
    <path d="M-58,-100 Q-76,-84 -68,-68" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 5. Fenn, delegate: the set square held as a frame -->
  <g transform="translate(975,670)">
    <ellipse cx="2" cy="4" rx="62" ry="7" fill="#DDD6C8"/>
    <path d="M132,-70 V0 m-12,0 h24" fill="none" stroke="#BDB5A6" stroke-width="4" stroke-linecap="round"/>
    <use href="#card" x="100" y="-170"/>
    <use href="#fenn"/>
    <path fill-rule="evenodd" d="M88,-95 L160,-95 L88,-167 Z M97,-104 L138,-104 L97,-145 Z" fill="#7C3AED" fill-opacity="0.82" filter="url(#sh)"/>
    <path d="M62,-102 Q76,-86 89,-96" fill="none" stroke="#2F1063" stroke-width="6" stroke-linecap="round"/>
    <path d="M-60,-100 Q-78,-84 -68,-68" fill="none" stroke="#2F1063" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 6. Tally, the record-keeper: the tape held flat at one tick -->
  <g transform="translate(1265,670)">
    <ellipse cx="2" cy="4" rx="50" ry="7" fill="#DDD6C8"/>
    <use href="#tally"/>
    <g filter="url(#sh)">
      <circle cx="-94" cy="-90" r="16" fill="#FFFDF8"/>
      <path d="M-94,-101 H88 L82,-92 L88,-83 H-94 Z" fill="#FFFDF8"/>
    </g>
    <circle cx="-94" cy="-90" r="10" fill="none" stroke="#CFC8BA" stroke-width="2"/>
    <circle cx="-94" cy="-90" r="4" fill="#CFC8BA"/>
    <path d="M-70,-97 v10 M-56,-97 v10 M-42,-97 v10 M-28,-97 v10 M-14,-97 v10 M14,-97 v10 M28,-97 v10 M42,-97 v10 M56,-97 v10 M70,-97 v10" fill="none" stroke="#A39C8D" stroke-width="2.500" stroke-linecap="round"/>
    <path d="M0,-98 v12" fill="none" stroke="#1F2430" stroke-width="4" stroke-linecap="round"/>
    <path d="M-44,-112 Q-64,-108 -56,-93 M44,-112 Q64,-108 56,-93" fill="none" stroke="#5E574F" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 7. Maren, the owner: taps the page with the capped pen -->
  <g transform="translate(1480,676)">
    <ellipse cx="2" cy="6" rx="78" ry="9" fill="#DDD6C8"/>
    <use href="#maren"/>
    <path d="M-44,-316 L-74,-252 L-64,-204" fill="none" stroke="#343B4D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(-84,-240) rotate(-8)" >
      <rect x="-30" y="-40" width="60" height="80" fill="#FFFDF8" filter="url(#sh)"/>
      <path d="M-20,-26 H20 M-20,-13 H12 M-20,0 H18 M-20,13 H6" fill="none" stroke="#CFC8BA" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="-64" cy="-203" r="10" fill="#C68B62"/>
    <path d="M44,-316 L34,-246 L-12,-226" fill="none" stroke="#343B4D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-14,-226 L-52,-239" fill="none" stroke="#6B7280" stroke-width="7" stroke-linecap="round"/>
    <path d="M-50,-238.300 L-74,-246.500" fill="none" stroke="#1F2430" stroke-width="9" stroke-linecap="round"/>
    <path d="M-53,-243.500 L-66,-248" fill="none" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-82" cy="-251" r="2.500" fill="#A39C8D"/><circle cx="-90" cy="-254" r="2.500" fill="#A39C8D"/>
    <circle cx="-12" cy="-226" r="10" fill="#C68B62"/>
  </g>
</svg>
