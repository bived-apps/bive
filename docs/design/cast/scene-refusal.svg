<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Polite refusal</title>
  <desc id="d">A small light violet droplet, a delegate, holds a finished card out to the amber folder-shaped coordinator and points its other arm back at a low table where finished cards are stacked. The coordinator does not take the card: it spreads both arms wide with open, empty hands, and holds no pen. Both look toward the right, where the human owner in a dark ink coat is still reading a page, her pen capped and hanging in her other hand. The card stays with the delegate until she decides.</desc>
