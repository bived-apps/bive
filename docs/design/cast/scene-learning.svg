<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Learning a lesson</title>
  <desc id="d">On the left a short grey paper-roll figure, the record-keeper, holds a long tape flat with both hands. Along the tape run small light tick marks; two heavy dark ticks sit side by side, and after them a long run of light, even ticks. On the right the small light violet droplet, a delegate, looks at the tape, holding its finished card and its one paintbrush. A small coral knot now hangs on its cord of three beads. It stands on the same floor, at the same size as before: the lesson adds a knot, nothing else.</desc>
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceAlpha" dx="4" dy="5" result="o"/>
      <feFlood flood-color="#1F2430" flood-opacity="0.16"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rollclip"><rect x="-48" y="-152" width="96" height="114" rx="40"/></clipPath>

    <!-- Tally: a short roll of paper with a pencil stub tucked behind -->
    <g id="tally">
      <path d="M-16,-42 V0 h-12 M16,-42 V0 h12" fill="none" stroke="#5E574F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="rotate(-24 -24 -150)">
        <rect x="-29" y="-180" width="10" height="34" fill="#D6CFC2"/>
        <path d="M-29,-180 L-24,-192 L-19,-180 Z" fill="#C9A56A"/>
        <path d="M-26,-187 L-24,-192 L-22,-187 Z" fill="#1F2430"/>
      </g>
      <g filter="url(#sh)">
        <rect x="-48" y="-152" width="96" height="114" rx="40" fill="#8A8178"/>
        <path d="M16,-160 L60,-160 L60,-30 L6,-30 Z" fill="#9D948A" clip-path="url(#rollclip)"/>
        <path d="M15,-152 L32,-150 L14,-130 Z" fill="#BDB5AA"/>
      </g>
    </g>
    <!-- Pim: a hand-cut droplet with a bent tip -->
    <g id="pim">
      <path d="M-16,-40 V0 h-12 M16,-40 V0 h12" fill="none" stroke="#5B33C9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g filter="url(#sh)">
        <path d="M-14,-146 L22,-150 L36,-124 L50,-88 L40,-52 L8,-34 L-30,-42 L-50,-78 L-40,-122 Z" fill="#8B5CF6"/>
        <path d="M-14,-146 L22,-150 L20,-188 Z" fill="#B79CFB"/>
        <path d="M-50,-78 L-30,-42 L8,-34 L-16,-66 Z" fill="#7446E0"/>
        <path d="M-40,-122 L-14,-146 L-24,-116 Z" fill="#9D78F9"/>
      </g>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#F7F5F0"/>
  <path d="M180,96 L1540,120 L1548,668 L60,676 L66,204 Z" fill="#F1EDE4"/>
