<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Asking the advisor</title>
  <desc id="d">On the left the amber folder-shaped coordinator, with its mustard flag and its fan of cards in its pocket, asks a question: mouth open, one arm pointing at a page on a stand, the other raised with an open hand. On the right a tall teal figure folded like a letter, the advisor, has no arms: it cannot touch, write or carry anything. It reviews by looking: a pale sight cone runs from its eyes onto one line of the page and leaves no mark. It answers with a small bubble holding a single dot. Its top flap is tipping forward to fold shut; a dashed outline shows where the flap stood open.</desc>
