<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">One delegate in three poses</title>
  <desc id="d">The same cut-paper delegate, a violet square with one dog-eared corner, a coral knotted ribbon and a spool of thread, drawn three times at the same size on the same ground: standing idle with the spool at its side; reaching up to check its own folded corner before handing work over; and laying a thread under one line of a card. Shape, colours, ribbon and proportions are identical in all three.</desc>
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceAlpha" dx="4" dy="5" result="o"/>
      <feFlood flood-color="#1F2430" flood-opacity="0.16"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="card">
      <rect width="64" height="100" fill="#FFFDF8" filter="url(#sh)"/>
      <rect width="64" height="8" fill="#E4DED2"/>
      <path d="M8,24 H56 M8,38 H48 M8,66 H52 M8,80 H40" fill="none" stroke="#CFC8BA" stroke-width="4" stroke-linecap="round"/>
      <path d="M8,52 H56" fill="none" stroke="#7A7468" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Odet: a square with a dog-eared corner and a knotted ribbon -->
    <g id="odet">
      <path d="M-20,-44 V0 h-13 M20,-44 V0 h13" fill="none" stroke="#4A1AA0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g filter="url(#sh)">
        <path d="M-60,-156 L22,-160 L58,-126 L60,-44 L-56,-40 Z" fill="#6D28D9"/>
        <path d="M-60,-156 L-56,-40 L-22,-41 Z" fill="#5A1FBF"/>
        <path d="M22,-160 L58,-126 L24,-123 Z" fill="#A98BF5"/>
      </g>
      <path d="M-44,-157 l-13,15 M-44,-157 l5,20" fill="none" stroke="#E4674F" stroke-width="5" stroke-linecap="butt"/>
      <rect x="-49" y="-162" width="10" height="10" fill="#C9523C" transform="rotate(-12 -44 -157)"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#F7F5F0"/>
  <path d="M60,150 L1500,128 L1546,176 L1540,612 L66,620 Z" fill="#F1EDE4"/>
  <path d="M0,640 L1600,632 L1600,900 L0,900 Z" fill="#EAE5DA"/>
  <ellipse cx="274" cy="708" rx="120" ry="12" fill="#DDD6C8"/>
  <g transform="translate(270,700) scale(2)">
    <use href="#odet"/>
    <circle cx="-14" cy="-108" r="7" fill="#F7F5F0"/><circle cx="14" cy="-109" r="7" fill="#F7F5F0"/>
    <circle cx="-14" cy="-107" r="3" fill="#1F2430"/><circle cx="14" cy="-108" r="3" fill="#1F2430"/>
    <path d="M-6,-88 h12" fill="none" stroke="#F7F5F0" stroke-width="3" stroke-linecap="round"/>
    <rect x="67" y="-77" width="14" height="22" fill="#3B2A6B"/>
    <rect x="64" y="-81" width="20" height="5" fill="#C9A56A"/><rect x="64" y="-56" width="20" height="5" fill="#C9A56A"/>
    <path d="M58,-96 Q76,-80 68,-62" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
    <path d="M-58,-100 Q-76,-84 -68,-68" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <ellipse cx="724" cy="708" rx="120" ry="12" fill="#DDD6C8"/>
  <g transform="translate(720,700) scale(2)">
    <use href="#odet"/>
    <circle cx="-14" cy="-108" r="7" fill="#F7F5F0"/><circle cx="14" cy="-109" r="7" fill="#F7F5F0"/>
    <circle cx="-11.5" cy="-110.5" r="3" fill="#1F2430"/><circle cx="16.5" cy="-111.5" r="3" fill="#1F2430"/>
    <path d="M-6,-85 l13,-4" fill="none" stroke="#F7F5F0" stroke-width="3" stroke-linecap="round"/>
    <rect x="-83" y="-77" width="14" height="22" fill="#3B2A6B"/>
    <rect x="-86" y="-81" width="20" height="5" fill="#C9A56A"/><rect x="-86" y="-56" width="20" height="5" fill="#C9A56A"/>
    <path d="M-58,-98 Q-80,-90 -76,-68" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-76" cy="-66" r="5.500" fill="#4A1AA0"/>
    <path d="M59,-100 Q82,-126 47,-137" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <ellipse cx="1164" cy="708" rx="120" ry="12" fill="#DDD6C8"/>
  <g transform="translate(1160,700) scale(2)">
    <path d="M124,-70 V0 m-12,0 h24" fill="none" stroke="#BDB5A6" stroke-width="4" stroke-linecap="round"/>
    <use href="#card" x="92" y="-170"/>
    <use href="#odet"/>
    <circle cx="-14" cy="-108" r="7" fill="#F7F5F0"/><circle cx="14" cy="-109" r="7" fill="#F7F5F0"/>
    <circle cx="-11.5" cy="-108" r="3" fill="#1F2430"/><circle cx="16.5" cy="-109" r="3" fill="#1F2430"/>
    <path d="M-5,-88 h12" fill="none" stroke="#F7F5F0" stroke-width="3" stroke-linecap="round"/>
    <path d="M76,-111.500 H152 q7,0 7,7 q0,6 -5,4" fill="none" stroke="#3B2A6B" stroke-width="2.500" stroke-linecap="round"/>
    <rect x="63" y="-121" width="14" height="22" fill="#3B2A6B"/>
    <rect x="60" y="-125" width="20" height="5" fill="#C9A56A"/><rect x="60" y="-100" width="20" height="5" fill="#C9A56A"/>
    <path d="M57,-96 Q64,-86 70,-96" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
    <path d="M-58,-100 Q-76,-84 -68,-68" fill="none" stroke="#4A1AA0" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
