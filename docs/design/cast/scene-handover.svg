<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Handover</title>
  <desc id="d">Three moments read left to right, each on its own sheet of wall paper. First, an amber folder-shaped coordinator with a small mustard flag keeps a fan of cards in its pocket and holds out exactly one light violet card to a small light violet droplet, a delegate holding one paintbrush. Second, the droplet alone paints that one card on a stand. Third, the coordinator carries the finished card in both hands up to the human owner in a dark ink coat, who reaches for it; her pen hangs capped in her other hand, and the coordinator holds no pen.</desc>
