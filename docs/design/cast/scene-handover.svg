    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceAlpha" dx="4" dy="5" result="o"/>
      <feFlood flood-color="#1F2430" flood-opacity="0.16"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="flag">
      <path d="M0,0 V-50" fill="none" stroke="#5B5548" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,-50 L28,-41 L0,-32 Z" fill="#E0A82E"/>
    </g>

    <!-- Brae: an expanding folder, top edge folded over -->
    <g id="brae3">
      <path d="M-28,-44 V0 h-14 M28,-44 V0 h14" fill="none" stroke="#8A3F06" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
