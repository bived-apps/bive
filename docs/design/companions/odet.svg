<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="t d">
  <title id="t">Odet, a delegate</title>
  <desc id="d">A violet cut-paper square with a pale dog-eared corner and a small coral knotted ribbon, on a soft round cream ground: two dot eyes, a straight mouth, and one arm holding a dark spool whose thread trails away.</desc>
