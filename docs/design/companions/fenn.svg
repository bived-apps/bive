<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="t d">
  <title id="t">Fenn, a delegate</title>
  <desc id="d">A deep violet cut-paper box lid, four flaps round a square panel, on a soft round cream ground: two dot eyes and a smile, a small mustard flag standing behind it, and one arm holding a brighter violet set square.</desc>
