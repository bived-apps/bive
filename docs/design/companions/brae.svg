<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="t d">
  <title id="t">Brae, the coordinator</title>
  <desc id="d">A wide amber cut-paper folder on a soft round cream ground: its top edge is folded over in a lighter amber, it has two dot eyes and a smile, a small mustard flag stands behind it, and a fan of violet task cards and one cream card shows in its front pocket.</desc>
