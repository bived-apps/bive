  <title id="t">Pim, a delegate</title>
  <desc id="d">A small light violet cut-paper droplet with a bent pale tip, on a soft round cream ground: two dot eyes, a belt of three small beads, and one arm holding up a paintbrush with a wooden handle and dark bristles.</desc>
