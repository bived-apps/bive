  <path d="M450 252V345H145V256" stroke="#1F2430" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#a)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1F2430">
    <text x="335" y="198" text-anchor="middle">gate 1: the plan</text>
    <text x="335" y="256" text-anchor="middle">gate 2: failed twice</text>
    <text x="565" y="140">question, advice only</text>
    <text x="758" y="134">brief</text>
    <text x="758" y="314">brief</text>
    <text x="808" y="152">push + report</text>
    <text x="808" y="296">push + report</text>
    <text x="570" y="310" text-anchor="middle">opens PR to the integration branch</text>
    <text x="297" y="370" text-anchor="middle">gate 3: pull request to main, only the owner merges</text>
  </g>
</svg>
