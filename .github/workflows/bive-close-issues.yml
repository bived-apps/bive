name: bive-close-issues

# Issue #229. Closing keywords act on the default branch only, so an issue finished on `bived` or `milestone/**`
# stays open until someone closes it. This closes it, with a provenance comment, once its pull request is merged.
# Merged pull requests only. The job reads the event and the pull request body through the API; it never checks out
# or runs the pull request's head. The script is taken from the base branch the pull request was merged into.
# GitHub reads this workflow file from the default branch for some events: it activates once it is on `main`.

on:
  pull_request:
    types: [closed]
    branches: [bived, "milestone/**"]

permissions:
  contents: read
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Close the issues this merged pull request completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/close-integration-issues.mjs
