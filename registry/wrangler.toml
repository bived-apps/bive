# Deploy: npx wrangler d1 create bive-registry  (paste the database_id below)
#         npx wrangler d1 execute bive-registry --remote --file schema.sql
#         npx wrangler deploy
name = "bive-registry"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "bive-registry"
database_id = "REPLACE-WITH-THE-ID-FROM-d1-create"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
